<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(e) {
            if (e && (
              (e.message && String(e.message).includes('WebSocket')) ||
              (e.filename && String(e.filename).includes('@vite/client'))
            )) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);
          window.addEventListener('unhandledrejection', function(e) {
            if (e && String(e.reason).includes('WebSocket')) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite') || url.includes(':24678')))) {
                var fake = {
                  readyState: 1,
                  binaryType: 'blob',
                  send: function() {},
                  close: function() {},
                  onopen: null,
                  onmessage: null,
                  onerror: null,
                  onclose: null,
                  addEventListener: function(type, listener) {
                    if (type === 'open') {
                      setTimeout(function() {
                        try { listener({ type: 'open' }); } catch(err) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; }
                };
                return fake;
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = OrigWS.CONNECTING;
            window.WebSocket.OPEN = OrigWS.OPEN;
            window.WebSocket.CLOSING = OrigWS.CLOSING;
            window.WebSocket.CLOSED = OrigWS.CLOSED;
          }
        }
      })();
    </script>
